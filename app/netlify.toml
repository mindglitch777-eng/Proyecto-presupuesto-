# Cómo arma Netlify la app (Next.js). La carpeta base del sitio es app/.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptador de Next.js para Netlify (crea las funciones del servidor: cuentas, app, middleware).
[[plugins]]
  package = "@netlify/plugin-nextjs"
