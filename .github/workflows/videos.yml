name: Videos

# Arma los avisos de En Claro: genera la voz argentina (es-AR-TomasNeural), saca 3 imágenes de control
# y renderiza un MP4 por cada gancho. Todo queda para descargar en la pestaña Actions → la corrida → Artifacts.

on:
  push:
    paths:
      - "videos/**"
      - ".github/workflows/videos.yml"
  workflow_dispatch:

concurrency:
  group: videos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: videos

jobs:
  voz:
    name: Voz de Tomás
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg y edge-tts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts==7.3.1
      - name: Generar la voz (solo lo que cambió)
        run: |
          for f in guiones/*.json; do python scripts/voz.py "$f" --si-cambio; done
      - name: Guardar la voz en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voces
          if git diff --cached --quiet; then
            echo "La voz no cambió."
          else
            git commit -m "Videos: voz generada con es-AR-TomasNeural"
            git push || echo "No se pudo guardar la voz en el repo (igual se usa en este render)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: voces
          path: videos/public/voces
          if-no-files-found: ignore

  video:
    name: Video ${{ matrix.nombre }}
    needs: voz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: la-persiana-gancho-A
            id: LaPersiana
            control: "36 535 944"
          - nombre: la-persiana-gancho-B
            id: LaPersiana-ganchoB
          - nombre: la-persiana-gancho-C
            id: LaPersiana-ganchoC
          - nombre: la-persiana-gancho-D
            id: LaPersiana-ganchoD
          - nombre: 01-el-duenio-del-local
            id: Video01-ElDueno
            control: "0 300 560"
          - nombre: 02-el-banco-del-barrio
            id: Video02-Banco
            control: "0 54 270 450 790"
          - nombre: 03-tu-kiosco-se-hunde
            id: Video03-SeHunde
            control: "0 54 330 480 700 850"
          - nombre: v4-01-el-numero-tapado
            id: Video-v4-01-NumeroTapado
            control: "0 54 440 520 615 840 980"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: videos/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: voces
          path: videos/public/voces
        continue-on-error: true
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
          npx remotion browser ensure
      - name: Imágenes de control
        if: matrix.control
        run: |
          mkdir -p out
          n=1
          for f in ${{ matrix.control }}; do
            npx remotion still src/index.ts ${{ matrix.id }} "out/control-$n-cuadro-$f.png" --frame=$f
            n=$((n+1))
          done
      - uses: actions/upload-artifact@v4
        if: matrix.control
        with:
          name: imagenes-de-control-${{ matrix.nombre }}
          path: videos/out/control-*.png
      - name: Renderizar el video
        run: npx remotion render src/index.ts ${{ matrix.id }} out/crudo.mp4 --codec=h264 --crf=18 --audio-codec=aac --concurrency=100%
      - name: Volumen parejo (−14 LUFS)
        run: |
          ffmpeg -y -v error -i out/crudo.mp4 -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11 -ar 48000 -c:a aac -b:a 192k -movflags +faststart "out/en-claro-${{ matrix.nombre }}.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames -of compact "out/en-claro-${{ matrix.nombre }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.nombre }}
          path: videos/out/en-claro-${{ matrix.nombre }}.mp4

  publicar:
    name: Dejar los MP4 sueltos en la rama videos-listos
    needs: video
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: mp4
          merge-multiple: true
      - name: Subir los MP4 (una sola confirmación que se pisa cada vez, el repo no crece)
        run: |
          cd mp4
          ls -la
          git init -q -b videos-listos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.mp4
          git commit -q -m "MP4 listos (${{ github.sha }})"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" videos-listos
