name: App

# Cada cambio en app/ corre las pruebas de la lógica, las de seguridad de la base de datos (Postgres real) y el armado.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  probar:
    name: Pruebas y armado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas de la lógica
        run: npm test
      - name: Pruebas de seguridad de la base (cada persona ve solo lo suyo, vencidos sin datos)
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:prueba@localhost:5432/postgres
      - name: Armado
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-publica-de-ejemplo
