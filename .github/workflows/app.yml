name: App

# Cada cambio en app/ corre las pruebas de la lógica, las de seguridad de la base de datos (Postgres real) y el armado.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  # Todas las noches (04:23 de Argentina) aunque nadie toque nada: si Supabase, Next o los navegadores cambian algo
  # y se rompe una función, nos enteramos antes que los clientes (ver app/PROBLEMAS.md).
  schedule:
    - cron: "23 7 * * *"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  probar:
    name: Pruebas y armado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas de la lógica
        run: npm test
      - name: Pruebas de seguridad de la base (cada persona ve solo lo suyo, vencidos sin datos)
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:prueba@localhost:5432/postgres
      - name: Armado
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-publica-de-ejemplo

  completa:
    name: Prueba completa con Supabase real
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Levantar Supabase (base, registro, datos y casilla de mails de prueba)
        run: npx --yes supabase@2.122.0 start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta
      - name: Claves del Supabase de prueba
        run: |
          npx --yes supabase@2.122.0 status -o env > .supa.env
          set -a; . ./.supa.env; set +a
          echo "SUPA_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPA_ANON=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPA_SERVICE=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "MAIL_URL=${MAILPIT_URL:-$INBUCKET_URL}" >> "$GITHUB_ENV"
          echo "Supabase en $API_URL · casilla de mails en ${MAILPIT_URL:-$INBUCKET_URL}"
      - name: Armar la app apuntando a ese Supabase
        run: NEXT_PUBLIC_SUPABASE_URL="$SUPA_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPA_ANON" NEXT_PUBLIC_WHATSAPP=5493756000000 npm run build
      - name: Prender la app
        run: |
          SUPABASE_SERVICE_ROLE_KEY="$SUPA_SERVICE" NEXT_PUBLIC_WHATSAPP=5493756000000 nohup npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/ > /dev/null && break; sleep 1; done
      - name: Instalar los navegadores de prueba (Chrome y Safari)
        run: |
          npm i -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium webkit
      - name: Recorrido completo de dos usuarios (360 px)
        run: NODE_PATH="$(npm root -g)" node scripts/e2e-real.cjs
      - name: Escenarios (errores, casos raros, doble toque, sesiones) en Chrome de Android
        if: always()
        run: NODE_PATH="$(npm root -g)" node scripts/e2e-escenarios.cjs
      - name: Escenarios en Safari de iPhone
        if: always()
        run: NODE_PATH="$(npm root -g)" NAVEGADOR=webkit node scripts/e2e-escenarios.cjs
      - name: Registro de la app si algo falló
        if: failure()
        run: tail -100 next.log
